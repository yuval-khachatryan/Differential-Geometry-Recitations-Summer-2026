<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מעגל היחידה עם כיוון השעון</title>
<link rel="stylesheet" href="../shared/quadviz.css">
</head>
<body>
<div id="app"></div>
<script src="../shared/mathrender.js"></script>
<script src="../shared/curve2d.js"></script>
<script>
Curve2D.mount({
  f: function (s) { return [Math.cos(s), -Math.sin(s)]; },
  tMin: 0, tMax: 2 * Math.PI,
  paramLabel: "אורך הקשת s",
  title: "מעגל היחידה — עם כיוון השעון",
  show: { tn: true },
  readout: ["k", "theta", "turn"],
  hint: "אותה קבוצת נקודות, כיוון סריקה הפוך: k ≡ −1 ו-Δθ מגיעה ל-−2π."
});
</script>
</body>
</html>
