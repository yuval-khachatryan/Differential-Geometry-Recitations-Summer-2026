<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>האוולוט של הציקלואידה</title>
<link rel="stylesheet" href="../shared/quadviz.css">
</head>
<body>
<div id="app"></div>
<script src="../shared/mathrender.js"></script>
<script src="../shared/evoinv.js"></script>
<script>
/* The cycloid with a = 1, over FOUR arches. The cusps at t = 0, 2*pi, 4*pi are not
   regular points -- gamma' = 0 there, so neither the frame nor the curvature is
   defined -- and the range stops just short of the outer two. The cusp at t = 2*pi
   is interior to the range; the curve passes through it continuously (E and gamma
   meet there), and no sample lands exactly on it.

   Two arches, because over a single one the picture misleads: E has its cusp in
   the MIDDLE of the range, at t = pi, so one arch of gamma buys only two half
   arches of E and the congruence of the two curves is not visible. */
EvoInv.mount({
  mode: "evolute",
  f: function (t) { return [t - Math.sin(t), 1 - Math.cos(t)]; },
  /* deliberately NOT symmetric about 2*pi: with equal trims the slider's
     midpoint lands exactly on the interior cusp, where the frame is undefined */
  tMin: 0.05, tMax: 8 * Math.PI - 0.13,
  title: "γ(t) = (t − sin t, 1 − cos t)",
  paramLabel: "הפרמטר t",
  aspect: 0.26,
  hint: "מרכז המעגל המשיק מסמן את נקודת האוולוט. הפעילו את המחוון: העקומה המצטברת היא ציקלואידה נוספת, החופפת למקורית עד כדי הזזה. שימו לב שהחודים של האוולוט נמצאים באמצע הקשתות של העקומה המקורית, ולהפך."
});
</script>
</body>
</html>
