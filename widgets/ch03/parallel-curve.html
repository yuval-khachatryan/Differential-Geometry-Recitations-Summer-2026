<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>העקומה המקבילה</title>
<link rel="stylesheet" href="../shared/quadviz.css">
</head>
<body>
<div id="app"></div>
<script src="../shared/mathrender.js"></script>
<script src="../shared/parallel.js"></script>
<script>
/* The ellipse. Its 1/k ranges from 1/2 at the ends of the major axis to 4 at the
   ends of the minor axis, so lambda*k = 1 would first bite at lambda = 1/2. The
   slider stops short of that, at 0.4, so gamma_lambda stays regular throughout
   and the degenerate case never has to be explained away. */
ParallelCurve.mount({
  f: function (t) { return [2 * Math.cos(t), Math.sin(t)]; },
  tMin: 0, tMax: 2 * Math.PI,
  lamMin: -1.0, lamMax: 0.4,
  title: "γ(t) = (2 cos t, sin t)",
  hint: "הקווים המנוקדים הם הנורמלים, וכולם באותו אורך λ. שנו את λ וראו כיצד העקומה המקבילה נעה פנימה והחוצה, תמיד במרחק קבוע מן העקומה המקורית."
});
</script>
</body>
</html>
