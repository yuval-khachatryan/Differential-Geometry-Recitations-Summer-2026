<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משטח ישר</title>
<link rel="stylesheet" href="../shared/quadviz.css">
</head>
<body>
<div id="app"></div>
<script src="../shared/mathrender.js"></script>
<script src="../shared/surface3d.js"></script>
<script>
/* The helicoid as a RULED surface: what matters is that a straight line is being
   carried along a base curve, so the slider sweeps u and the surface exists only
   as far as the line has travelled. The purple segment is the current ruling; the
   dark trail is alpha(u), the path of the point the line is anchored at. */
Surface3D.mount({
  f: function (u, v) { return [v * Math.cos(u), v * Math.sin(u), 0.3 * u]; },
  uMin: 0, uMax: 3 * Math.PI, vMin: -1.15, vMax: 1.15,
  nu: 60, nv: 20,
  sweep: { over: "u", label: "הזזת הישר", base: 0 },
  vCurves: [0.5, 1.3, 2.1, 2.9, 3.7, 4.5, 5.3, 6.1, 6.9, 7.7, 8.5],
  title: "x(u,v) = α(u) + v·β(u),   α(u) = (0,0,bu),   β(u) = (cos u, sin u, 0)",
  hint: "גררו את הציור כדי לסובב את המבט. הזיזו את המחוון: הקטע הסגול הוא הישר היוצר במיקומו הנוכחי, והמשטח כולו נוצר בדיוק מן המסלול שלו. הנקודה הכהה היא α(u), הנקודה שאליה הישר מעוגן, והעקומה הכהה היא המסלול שלה. שימו לב שהישר נשאר ישר לאורך כל הדרך, וזו בדיוק המשמעות של משטח ישר."
});
</script>
</body>
</html>
