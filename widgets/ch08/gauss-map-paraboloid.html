<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>העתקת גאוס של הפרבולואיד</title>
<link rel="stylesheet" href="../shared/quadviz.css">
</head>
<body>
<div id="app"></div>
<script src="../shared/autosize.js"></script>

<script>
/* gauss-map-paraboloid.html — the Gauss map of z = u^2 + v^2, beside its image.
   ---------------------------------------------------------------------------
   ONE surface, the one its exercise is about. An earlier version of this page
   carried a selector for plane / cylinder / sphere / paraboloid; that merged
   four separate claims into a single widget sitting in a single place, which is
   not what a simulation is for. The plane / cylinder / sphere comparison is a
   figure beside the remark that makes it, and this page illustrates only the
   exercise it sits next to.

   Standalone rather than Surface3D.mount(): that module draws one surface with
   x_u, x_v and a tangent patch, and has no second linked view. Projection,
   painter's algorithm and auto-fit are copied from surface3d.js so this looks
   like the rest of the book, and one yaw/pitch drives BOTH panels -- that is
   what makes the correspondence legible while rotating.

   The image of the Gauss map is itself a parametrised surface, (u,v) |-> N(u,v)
   on the unit sphere, so it is meshed like any other surface and painted over a
   plain sphere. N comes from central differences on the SAME f, never from the
   closed form the exercise derives, so the picture cannot silently agree with a
   wrong answer.
   --------------------------------------------------------------------------- */
(function () {
  "use strict";

  var COL = {
    surf: "#bcd4ea", edge: "#7ba6cf",
    ball: "#e8edf3", ballEdge: "#c3cedb",
    img:  "#c0392b", imgEdge: "#8d2a1e",
    pt:   "#0f172a", nrm: "#1f4e79"
  };

  var TWO_PI = 2 * Math.PI, U0 = -1.2, U1 = 1.2, NU = 20;

  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function norm(a) { return Math.sqrt(dot(a, a)); }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function unit(a) { var n = norm(a); return n ? mul(a, 1 / n) : a; }
  function fmt(v) {
    var s = (Math.abs(v) < 5e-3 ? 0 : v).toFixed(2);
    return s === "-0.00" ? "0.00" : s;
  }

  function f(u, v) { return [u, v, u * u + v * v]; }

  function normalAt(u, v) {
    var e = 1e-5,
        xu = mul(sub(f(u + e, v), f(u - e, v)), 1 / (2 * e)),
        xv = mul(sub(f(u, v + e), f(u, v - e)), 1 / (2 * e));
    return unit(cross(xu, xv));
  }

  var host = document.getElementById("app"),
      yaw = -0.95, pitch = 0.40;

  host.innerHTML =
    '<div class="qv">' +
      '<p class="qv-title" dir="ltr">z = u&sup2; + v&sup2;   &rarr;   N(u,v) &isin; S&sup2;</p>' +
      '<div class="qv-canvas-wrap"><canvas class="qv-canvas qv-grab"></canvas></div>' +
      '<div class="qv-row">' +
        '<span class="qv-label">מיקום הנקודה, פרמטר ראשון</span>' +
        '<input class="qv-slider qv-u" type="range" min="0" max="1000" value="700">' +
        '<span class="qv-badge qv-uval"></span>' +
      '</div>' +
      '<div class="qv-row">' +
        '<span class="qv-label">מיקום הנקודה, פרמטר שני</span>' +
        '<input class="qv-slider qv-v" type="range" min="0" max="1000" value="330">' +
        '<span class="qv-badge qv-vval"></span>' +
      '</div>' +
      '<div class="qv-dirs">' +
        '<span><b>p</b>&nbsp;<span dir="ltr" class="qv-r-p"></span></span>' +
        '<span><b>N(p)</b>&nbsp;<span dir="ltr" class="qv-r-n"></span></span>' +
        '<span><b>N&#8323;</b>&nbsp;<span dir="ltr" class="qv-r-n3"></span></span>' +
      '</div>' +
      '<div class="qv-hint">גררו את הציור כדי לסובב את שני הפאנלים יחד. האזור האדום הוא התמונה של המשטח כולו תחת העתקת גאוס. הרכיב השלישי של הנורמל חיובי תמיד, ולכן התמונה נשארת בחצי הספירה העליון הפתוח: ככל שמתרחקים מן הקודקוד המשטח נעשה תלול, והתמונה מתקרבת אל קו המשווה בלי להגיע אליו.</div>' +
    '</div>';

  var cv = host.querySelector("canvas"), ctx = cv.getContext("2d"),
      sU = host.querySelector(".qv-u"), uval = host.querySelector(".qv-uval"),
      sV = host.querySelector(".qv-v"), vval = host.querySelector(".qv-vval"),
      rP = host.querySelector(".qv-r-p"), rN = host.querySelector(".qv-r-n"),
      rN3 = host.querySelector(".qv-r-n3");

  function project(p) {
    var ca = Math.cos(yaw), sa = Math.sin(yaw),
        cb = Math.cos(pitch), sb = Math.sin(pitch),
        x1 = p[0] * ca - p[1] * sa,
        y1 = p[0] * sa + p[1] * ca;
    return [x1, y1 * sb + p[2] * cb, y1 * cb - p[2] * sb];
  }

  function fitter(pts, ox, ow, hgt) {
    var xs = [], ys = [], i;
    for (i = 0; i < pts.length; i++) { xs.push(pts[i][0]); ys.push(pts[i][1]); }
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs),
        ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys),
        pad = 1.18,
        sc = Math.min(ow / ((xmax - xmin) * pad || 1), hgt / ((ymax - ymin) * pad || 1)),
        cx = ox + ow / 2 - sc * (xmin + xmax) / 2,
        cy = hgt / 2 + sc * (ymin + ymax) / 2;
    return function (q) { return [cx + sc * q[0], cy - sc * q[1]]; };
  }

  function quadPath(S3, p) {
    ctx.beginPath();
    var s0 = S3(p[0]); ctx.moveTo(s0[0], s0[1]);
    for (var m = 1; m < p.length; m++) { var sm = S3(p[m]); ctx.lineTo(sm[0], sm[1]); }
    ctx.closePath();
  }

  function shade(r, g, b, t) {
    return "rgb(" + Math.round(255 - (255 - r) * t) + "," +
                    Math.round(255 - (255 - g) * t) + "," +
                    Math.round(255 - (255 - b) * t) + ")";
  }

  function arrow(S3, p3, tip3, col, lw, lab) {
    var s1 = S3(project(p3)), s2 = S3(project(tip3));
    ctx.beginPath(); ctx.moveTo(s1[0], s1[1]); ctx.lineTo(s2[0], s2[1]);
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
    var ang = Math.atan2(s2[1] - s1[1], s2[0] - s1[0]), h = lw > 1.6 ? 9 : 6;
    ctx.beginPath();
    ctx.moveTo(s2[0], s2[1]);
    ctx.lineTo(s2[0] - h * Math.cos(ang - 0.4), s2[1] - h * Math.sin(ang - 0.4));
    ctx.lineTo(s2[0] - h * Math.cos(ang + 0.4), s2[1] - h * Math.sin(ang + 0.4));
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    if (lab) {
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.fillStyle = col;
      ctx.fillText(lab, s2[0] + 6, s2[1] - 4);
    }
  }

  function draw() {
    var i, j, u, v;
    var uSel = U0 + (sU.value / 1000) * (U1 - U0),
        vSel = U0 + (sV.value / 1000) * (U1 - U0);

    var dpr = window.devicePixelRatio || 1,
        w = cv.clientWidth || 640, hgt = Math.round(w * 0.50);
    cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr);
    cv.style.height = hgt + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, hgt);
    ctx.direction = "ltr";          /* else minus signs in the labels reorder */
    ctx.lineJoin = "round";

    var P = [], G = [];
    for (i = 0; i <= NU; i++) {
      P.push([]); G.push([]);
      u = U0 + (i / NU) * (U1 - U0);
      for (j = 0; j <= NU; j++) {
        v = U0 + (j / NU) * (U1 - U0);
        P[i].push(project(f(u, v)));
        G[i].push(normalAt(u, v));
      }
    }

    /* ---------- left: the paraboloid ---------- */
    var half = w / 2, flat = [];
    for (i = 0; i <= NU; i++) for (j = 0; j <= NU; j += 2) flat.push(P[i][j]);
    var SL = fitter(flat, 0, half, hgt);

    var quads = [];
    for (i = 0; i < NU; i++) for (j = 0; j < NU; j++) {
      var a = P[i][j], b = P[i + 1][j], c = P[i + 1][j + 1], d = P[i][j + 1],
          nn = project(G[i][j]);
      quads.push({ z: (a[2] + b[2] + c[2] + d[2]) / 4, p: [a, b, c, d],
                   lit: Math.abs(nn[2]) });
    }
    quads.sort(function (p, q) { return p.z - q.z; });
    ctx.lineWidth = 0.4;
    quads.forEach(function (Q) {
      quadPath(SL, Q.p);
      ctx.fillStyle = shade(0xbc, 0xd4, 0xea, 0.35 + 0.65 * Q.lit);
      ctx.fill();
      ctx.strokeStyle = COL.edge; ctx.globalAlpha = 0.5; ctx.stroke();
      ctx.globalAlpha = 1;
    });

    var p3 = f(uSel, vSel), n3 = normalAt(uSel, vSel);
    arrow(SL, p3, add(p3, mul(n3, 0.8)), COL.nrm, 2.6, "N");
    var sp = SL(project(p3));
    ctx.beginPath(); ctx.arc(sp[0], sp[1], 5, 0, TWO_PI);
    ctx.fillStyle = COL.pt; ctx.fill();

    /* ---------- right: the unit sphere and the Gauss image ---------- */
    var ball = [], BU = 24, BV = 48, bu, bv;
    function ballPt(a, b) {
      return [Math.sin(a) * Math.cos(b), Math.sin(a) * Math.sin(b), Math.cos(a)];
    }
    for (i = 0; i <= BU; i++) {
      ball.push([]);
      bu = (i / BU) * Math.PI;
      for (j = 0; j <= BV; j++) {
        bv = (j / BV) * TWO_PI;
        ball[i].push(project(ballPt(bu, bv)));
      }
    }
    var bflat = [];
    for (i = 0; i <= BU; i++) for (j = 0; j <= BV; j += 2) bflat.push(ball[i][j]);
    var SR = fitter(bflat, half, half, hgt);

    var list = [];
    for (i = 0; i < BU; i++) for (j = 0; j < BV; j++) {
      list.push({ z: (ball[i][j][2] + ball[i + 1][j][2] +
                      ball[i + 1][j + 1][2] + ball[i][j + 1][2]) / 4,
                  p: [ball[i][j], ball[i + 1][j], ball[i + 1][j + 1], ball[i][j + 1]],
                  img: false,
                  lit: Math.abs(project(ballPt((i + 0.5) / BU * Math.PI,
                                               (j + 0.5) / BV * TWO_PI))[2]) });
    }
    for (i = 0; i < NU; i++) for (j = 0; j < NU; j++) {
      var ia = project(mul(G[i][j], 1.004)),
          ib = project(mul(G[i + 1][j], 1.004)),
          ic = project(mul(G[i + 1][j + 1], 1.004)),
          id = project(mul(G[i][j + 1], 1.004));
      list.push({ z: (ia[2] + ib[2] + ic[2] + id[2]) / 4 + 1e-3,
                  p: [ia, ib, ic, id], img: true });
    }
    list.sort(function (p, q) { return p.z - q.z; });
    list.forEach(function (Q) {
      quadPath(SR, Q.p);
      if (Q.img) {
        ctx.fillStyle = COL.img; ctx.globalAlpha = 0.55; ctx.fill();
        ctx.globalAlpha = 0.6; ctx.strokeStyle = COL.imgEdge;
        ctx.lineWidth = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = shade(0xe8, 0xed, 0xf3, 0.4 + 0.6 * Q.lit);
        ctx.fill();
        ctx.globalAlpha = 0.5; ctx.strokeStyle = COL.ballEdge;
        ctx.lineWidth = 0.4; ctx.stroke(); ctx.globalAlpha = 1;
      }
    });

    /* the equator, which the image approaches but never reaches */
    ctx.beginPath();
    for (j = 0; j <= 120; j++) {
      var e = SR(project(ballPt(Math.PI / 2, (j / 120) * TWO_PI)));
      if (j === 0) ctx.moveTo(e[0], e[1]); else ctx.lineTo(e[0], e[1]);
    }
    ctx.strokeStyle = COL.pt; ctx.globalAlpha = 0.45;
    ctx.lineWidth = 1.2; ctx.setLineDash([4, 3]); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;

    arrow(SR, [0, 0, 0], n3, COL.nrm, 1.6, null);
    var sn = SR(project(mul(n3, 1.01)));
    ctx.beginPath(); ctx.arc(sn[0], sn[1], 5.5, 0, TWO_PI);
    ctx.fillStyle = COL.pt; ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.2; ctx.stroke();

    uval.textContent = fmt(uSel);
    vval.textContent = fmt(vSel);
    rP.textContent = "(" + fmt(p3[0]) + ", " + fmt(p3[1]) + ", " + fmt(p3[2]) + ")";
    rN.textContent = "(" + fmt(n3[0]) + ", " + fmt(n3[1]) + ", " + fmt(n3[2]) + ")";
    rN3.textContent = fmt(n3[2]) + "  > 0";
  }

  var dragging = false, lastX = 0, lastY = 0;
  function down(e) {
    dragging = true;
    var p = e.touches ? e.touches[0] : e;
    lastX = p.clientX; lastY = p.clientY;
    if (e.touches) e.preventDefault();
  }
  function move(e) {
    if (!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    yaw += (p.clientX - lastX) * 0.01;
    pitch += (p.clientY - lastY) * 0.01;
    pitch = Math.max(-1.35, Math.min(1.35, pitch));
    lastX = p.clientX; lastY = p.clientY;
    if (e.touches) e.preventDefault();
    draw();
  }
  function up() { dragging = false; }

  cv.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  cv.addEventListener("touchstart", down, { passive: false });
  cv.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", up);

  sU.addEventListener("input", draw);
  sV.addEventListener("input", draw);
  window.addEventListener("resize", draw);
  draw();
})();
</script>
</body>
</html>
