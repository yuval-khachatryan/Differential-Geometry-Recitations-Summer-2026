<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ההתרחקות מן המישור המשיק</title>
<link rel="stylesheet" href="../shared/quadviz.css">
</head>
<body>
<div id="app"></div>
<script src="../shared/autosize.js"></script>

<script>
/* second-order.html — the deviation of x(u+du, v+dv) from the tangent plane
   at x(u,v), against the second fundamental form. ONE idea.
   ---------------------------------------------------------------------------
   An earlier version of this page also carried k1/k2 sliders, the four point
   types and K/H readouts. Those belong with the classification of points, which
   is a different section, so they moved out; this page now illustrates only the
   statement it sits beside:

       < x(u+du, v+dv) - x(u,v), N >  =  1/2 ( L11 du^2 + 2 L12 du dv + L22 dv^2 )
                                          + remainder,

   with the remainder vanishing faster than du^2 + dv^2.

   The surface is deliberately NOT a quadric. For z = (k1 u^2 + k2 v^2)/2 the
   second-order model is exact and there is no remainder to watch, which would
   hide the very thing the section is about. Cubic terms are included so the
   two numbers visibly disagree at large steps and visibly converge as the step
   shrinks.

   L_ij is computed from f by central differences, not from the closed form, so
   the readout is an independent check rather than a restatement.
   --------------------------------------------------------------------------- */
(function () {
  "use strict";

  var COL = {
    surf: "#bcd4ea", edge: "#7ba6cf",
    plane: "#94a3b8", dev: "#c0392b",
    nrm: "#1f4e79", pt: "#0f172a", ring: "#0f172a"
  };

  var TWO_PI = 2 * Math.PI, NG = 26, R = 1.15, h = 1e-3;

  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function norm(a) { return Math.sqrt(dot(a, a)); }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function unit(a) { var n = norm(a); return n ? mul(a, 1 / n) : a; }
  function fmt(v, d) {
    var s = (Math.abs(v) < 5e-5 ? 0 : v).toFixed(d === undefined ? 3 : d);
    return s === "-0.000" ? "0.000" : s;
  }

  /* a graph with genuine cubic terms, so the remainder is not identically zero */
  function H(u, v) {
    return 0.55 * u * u - 0.40 * v * v + 0.30 * u * v
         + 0.28 * u * u * u - 0.22 * u * v * v;
  }
  function f(u, v) { return [u, v, H(u, v)]; }

  function frame(u, v) {
    var xu  = mul(sub(f(u + h, v), f(u - h, v)), 1 / (2 * h)),
        xv  = mul(sub(f(u, v + h), f(u, v - h)), 1 / (2 * h)),
        xuu = mul(add(sub(f(u + h, v), mul(f(u, v), 2)), f(u - h, v)), 1 / (h * h)),
        xvv = mul(add(sub(f(u, v + h), mul(f(u, v), 2)), f(u, v - h)), 1 / (h * h)),
        xuv = mul(add(sub(sub(f(u + h, v + h), f(u + h, v - h)), f(u - h, v + h)),
                      f(u - h, v - h)), 1 / (4 * h * h)),
        N = unit(cross(xu, xv));
    return { xu: xu, xv: xv, N: N,
             L11: dot(xuu, N), L12: dot(xuv, N), L22: dot(xvv, N) };
  }

  var host = document.getElementById("app"),
      yaw = -0.9, pitch = 0.30, eps = 0.62, th = 0.9;

  host.innerHTML =
    '<div class="qv">' +
      '<p class="qv-title" dir="ltr">deviation of x(u+du, v+dv) from the tangent plane at x(u,v)</p>' +
      '<div class="qv-canvas-wrap"><canvas class="qv-canvas qv-grab"></canvas></div>' +
      '<div class="qv-row">' +
        '<span class="qv-label">גודל הצעד</span>' +
        '<input class="qv-slider qv-e" type="range" min="2" max="90" step="1" value="62">' +
        '<span class="qv-badge qv-eval"></span>' +
      '</div>' +
      '<div class="qv-row">' +
        '<span class="qv-label">כיוון הצעד</span>' +
        '<input class="qv-slider qv-t" type="range" min="0" max="1000" value="143">' +
        '<span class="qv-badge qv-tval"></span>' +
      '</div>' +
      '<div class="qv-readout">' +
        '<div><span class="qv-rl">deviation</span><span class="qv-rv qv-r-d"></span></div>' +
        '<div><span class="qv-rl">&frac12; II(du,dv)</span><span class="qv-rv qv-r-q"></span></div>' +
        '<div><span class="qv-rl">ratio</span><span class="qv-rv qv-r-r"></span></div>' +
      '</div>' +
      '<ul class="qv-gloss">' +
        '<li><b>deviation</b> &mdash; המרחק המסומן מן המישור המשיק אל המשטח, בנקודה שאליה הגיע הצעד.</li>' +
        '<li><b>&frac12; II(du,dv)</b> &mdash; מה שהתבנית היסודית השנייה חוזה, כלומר &frac12;(L&#8321;&#8321;du&sup2; + 2L&#8321;&#8322;du dv + L&#8322;&#8322;dv&sup2;).</li>' +
        '<li><b>ratio</b> &mdash; המנה ביניהם. ככל שהצעד קטן היא שואפת ל-1, וזו בדיוק האמירה שהשארית זניחה ביחס לריבוע הצעד.</li>' +
      '</ul>' +
      '<div class="qv-hint">גררו את הציור כדי לסובב את המבט. הקטע האדום הוא ההתרחקות עצמה. הקטינו את גודל הצעד וראו את שני המספרים מתקרבים זה לזה, ואת המנה שואפת ל-1, בכל כיוון שתבחרו.</div>' +
    '</div>';

  var cv = host.querySelector("canvas"), ctx = cv.getContext("2d"),
      sE = host.querySelector(".qv-e"), eval_ = host.querySelector(".qv-eval"),
      sT = host.querySelector(".qv-t"), tval = host.querySelector(".qv-tval"),
      rD = host.querySelector(".qv-r-d"), rQ = host.querySelector(".qv-r-q"),
      rR = host.querySelector(".qv-r-r");

  function project(p) {
    var ca = Math.cos(yaw), sa = Math.sin(yaw),
        cb = Math.cos(pitch), sb = Math.sin(pitch),
        x1 = p[0] * ca - p[1] * sa,
        y1 = p[0] * sa + p[1] * ca;
    return [x1, y1 * sb + p[2] * cb, y1 * cb - p[2] * sb];
  }

  function draw() {
    eps = parseInt(sE.value, 10) / 100;
    th = (sT.value / 1000) * TWO_PI;

    var dpr = window.devicePixelRatio || 1,
        /* capped so the sliders stay on screen together with the picture */
        w = cv.clientWidth || 560, hgt = Math.min(Math.round(w * 0.58), 400), i, j;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr);
    cv.style.height = hgt + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, hgt);
    ctx.direction = "ltr";          /* else minus signs in the labels reorder */
    ctx.lineJoin = "round";

    /* the base point is the origin of the patch; its tangent plane is z = 0
       there because H has no linear term, which keeps the picture readable */
    var F = frame(0, 0);

    var Sg = [], Pg = [], u, v;
    for (i = 0; i <= NG; i++) {
      Sg.push([]); Pg.push([]);
      u = -R + 2 * R * i / NG;
      for (j = 0; j <= NG; j++) {
        v = -R + 2 * R * j / NG;
        Sg[i].push(project(f(u, v)));
        Pg[i].push(project([u, v, 0]));
      }
    }

    var xs = [], ys = [];
    for (i = 0; i <= NG; i += 2) for (j = 0; j <= NG; j += 2) {
      xs.push(Sg[i][j][0], Pg[i][j][0]);
      ys.push(Sg[i][j][1], Pg[i][j][1]);
    }
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs),
        ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys),
        pad = 1.14,
        sc = Math.min(w / ((xmax - xmin) * pad || 1), hgt / ((ymax - ymin) * pad || 1)),
        cx = w / 2 - sc * (xmin + xmax) / 2,
        cy = hgt / 2 + sc * (ymin + ymax) / 2;
    function S(q) { return [cx + sc * q[0], cy - sc * q[1]]; }

    /* one painter's list: tangent plane and surface together. They intersect,
       so a per-quad painter interleaves them approximately; the plane is drawn
       translucent so the crossing still reads correctly. */
    var quads = [];
    for (i = 0; i < NG; i++) for (j = 0; j < NG; j++) {
      quads.push({ z: (Sg[i][j][2] + Sg[i + 1][j][2] +
                       Sg[i + 1][j + 1][2] + Sg[i][j + 1][2]) / 4,
                   p: [Sg[i][j], Sg[i + 1][j], Sg[i + 1][j + 1], Sg[i][j + 1]],
                   kind: "surf" });
      quads.push({ z: (Pg[i][j][2] + Pg[i + 1][j][2] +
                       Pg[i + 1][j + 1][2] + Pg[i][j + 1][2]) / 4,
                   p: [Pg[i][j], Pg[i + 1][j], Pg[i + 1][j + 1], Pg[i][j + 1]],
                   kind: "plane" });
    }
    quads.sort(function (p, q) { return p.z - q.z; });
    quads.forEach(function (Q) {
      ctx.beginPath();
      var s0 = S(Q.p[0]); ctx.moveTo(s0[0], s0[1]);
      for (var m = 1; m < 4; m++) { var sm = S(Q.p[m]); ctx.lineTo(sm[0], sm[1]); }
      ctx.closePath();
      if (Q.kind === "plane") {
        ctx.fillStyle = COL.plane; ctx.globalAlpha = 0.26; ctx.fill();
        ctx.globalAlpha = 0.30; ctx.strokeStyle = COL.plane; ctx.lineWidth = 0.4;
      } else {
        ctx.fillStyle = COL.surf; ctx.globalAlpha = 0.72; ctx.fill();
        ctx.globalAlpha = 0.7; ctx.strokeStyle = COL.edge; ctx.lineWidth = 0.4;
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    });

    /* the step, and the deviation it produces */
    var du = eps * Math.cos(th), dv = eps * Math.sin(th),
        q3 = f(du, dv),
        foot = [du, dv, 0],
        dev = dot(sub(q3, f(0, 0)), F.N),
        quad = 0.5 * (F.L11 * du * du + 2 * F.L12 * du * dv + F.L22 * dv * dv);

    /* the circle of steps of the current size, in the tangent plane */
    ctx.beginPath();
    for (i = 0; i <= 120; i++) {
      var a = (i / 120) * TWO_PI,
          s = S(project([eps * Math.cos(a), eps * Math.sin(a), 0]));
      if (i === 0) ctx.moveTo(s[0], s[1]); else ctx.lineTo(s[0], s[1]);
    }
    ctx.strokeStyle = COL.ring; ctx.globalAlpha = 0.45;
    ctx.lineWidth = 1.1; ctx.stroke(); ctx.globalAlpha = 1;

    var sFoot = S(project(foot)), sQ = S(project(q3)), sP = S(project(f(0, 0)));

    /* the step itself, in the tangent plane */
    ctx.beginPath(); ctx.moveTo(sP[0], sP[1]); ctx.lineTo(sFoot[0], sFoot[1]);
    ctx.strokeStyle = COL.nrm; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
    ctx.stroke(); ctx.setLineDash([]);

    /* the deviation: the gap from the plane up to the surface */
    ctx.beginPath(); ctx.moveTo(sFoot[0], sFoot[1]); ctx.lineTo(sQ[0], sQ[1]);
    ctx.strokeStyle = COL.dev; ctx.lineWidth = 3.4; ctx.stroke();

    [[sFoot, COL.nrm], [sQ, COL.dev], [sP, COL.pt]].forEach(function (X) {
      ctx.beginPath(); ctx.arc(X[0][0], X[0][1], 4.8, 0, TWO_PI);
      ctx.fillStyle = X[1]; ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.1; ctx.stroke();
    });

    eval_.textContent = fmt(eps, 2);
    tval.textContent = fmt(th / Math.PI, 2) + "π";
    rD.textContent = fmt(dev);
    rQ.textContent = fmt(quad);
    rR.textContent = Math.abs(quad) < 1e-9 ? "—" : fmt(dev / quad);
  }

  var dragging = false, lastX = 0, lastY = 0;
  function down(e) {
    dragging = true;
    var p = e.touches ? e.touches[0] : e;
    lastX = p.clientX; lastY = p.clientY;
    if (e.touches) e.preventDefault();
  }
  function move(e) {
    if (!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    yaw += (p.clientX - lastX) * 0.01;
    pitch += (p.clientY - lastY) * 0.01;
    pitch = Math.max(-1.35, Math.min(1.35, pitch));
    lastX = p.clientX; lastY = p.clientY;
    if (e.touches) e.preventDefault();
    draw();
  }
  function up() { dragging = false; }

  cv.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  cv.addEventListener("touchstart", down, { passive: false });
  cv.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", up);

  sE.addEventListener("input", draw);
  sT.addEventListener("input", draw);
  window.addEventListener("resize", draw);
  draw();
})();
</script>
</body>
</html>
