<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ארבעת סוגי הנקודות</title>
<link rel="stylesheet" href="../shared/quadviz.css">
</head>
<body>
<div id="app"></div>
<script src="../shared/autosize.js"></script>

<script>
/* point-types.html — the four point types, as k1 and k2 vary. ONE idea.
   ---------------------------------------------------------------------------
   Companion to euler-formula.html, which holds k1, k2 fixed and moves theta.
   Here theta is gone and only k1, k2 move, because "which of the four types is
   this point" is a different question from "how does k_n vary with direction".

   The surface is the second-order model z = (k1 u^2 + k2 v^2)/2 with its
   tangent plane at the origin, coloured by the SIGN of z -- that is, by which
   side of the tangent plane the surface is on. That colouring is the whole
   classification: one colour all round is elliptic, alternating quadrants is
   hyperbolic, one colour with a flat line through it is parabolic, and nothing
   at all is planar.

   Known limitation, shared with the other 3-D widgets here: hidden-surface
   removal is a per-quad painter's algorithm, so where a saddle cuts through its
   own tangent plane the two sheets interleave approximately. The plane is drawn
   translucent so the crossing still reads correctly.
   --------------------------------------------------------------------------- */
(function () {
  "use strict";

  var COL = {
    up: "#1f4e79", upEdge: "#16385a",
    down: "#c0392b", downEdge: "#8d2a1e",
    plane: "#94a3b8", pt: "#0f172a"
  };

  var TWO_PI = 2 * Math.PI, NG = 26, R = 1.0;

  function fmt(v, d) {
    var s = (Math.abs(v) < 5e-4 ? 0 : v).toFixed(d === undefined ? 1 : d);
    return s === "-0.0" ? "0.0" : s;
  }

  var host = document.getElementById("app"),
      yaw = -0.9, pitch = 0.30, k1 = 1.2, k2 = 0.8;

  host.innerHTML =
    '<div class="qv">' +
      '<p class="qv-title" dir="ltr">z = &frac12; ( k&#8321; u&sup2; + k&#8322; v&sup2; )' +
        ' &mdash; the second-order model at the point</p>' +
      '<div class="qv-canvas-wrap"><canvas class="qv-canvas qv-grab"></canvas></div>' +
      '<div class="qv-row">' +
        '<span class="qv-label">העקמומיות הראשית הראשונה</span>' +
        '<input class="qv-slider qv-k1" type="range" min="-20" max="20" step="1" value="12">' +
        '<span class="qv-badge qv-k1val"></span>' +
      '</div>' +
      '<div class="qv-row">' +
        '<span class="qv-label">העקמומיות הראשית השנייה</span>' +
        '<input class="qv-slider qv-k2" type="range" min="-20" max="20" step="1" value="8">' +
        '<span class="qv-badge qv-k2val"></span>' +
      '</div>' +
      '<div class="qv-readout">' +
        '<div><span class="qv-rl">K = k&#8321;k&#8322;</span><span class="qv-rv qv-r-K"></span></div>' +
        '<div><span class="qv-rl">H = (k&#8321;+k&#8322;)/2</span><span class="qv-rv qv-r-H"></span></div>' +
      '</div>' +
      '<div class="qv-legend">' +
        '<span><i class="qv-key" style="background:#1f4e79"></i>מעל המישור המשיק</span>' +
        '<span><i class="qv-key" style="background:#c0392b"></i>מתחת למישור המשיק</span>' +
      '</div>' +
      /* no dedicated class in quadviz.css: reuse the hint's prose styling and
         override only weight and colour from draw(), as ch07/mobius.html does */
      '<p class="qv-hint qv-verdict"></p>' +
      '<div class="qv-hint">גררו את הציור כדי לסובב את המבט. הזיזו את שתי העקמומיויות הראשיות ועברו בין ארבעת סוגי הנקודות. שימו לב לצבע: נקודה אליפטית היא בצבע אחד לכל סביבתה, ונקודה היפרבולית מתחלפת בצבע בין הרביעים.</div>' +
    '</div>';

  var cv = host.querySelector("canvas"), ctx = cv.getContext("2d"),
      s1 = host.querySelector(".qv-k1"), v1 = host.querySelector(".qv-k1val"),
      s2 = host.querySelector(".qv-k2"), v2 = host.querySelector(".qv-k2val"),
      rK = host.querySelector(".qv-r-K"), rH = host.querySelector(".qv-r-H"),
      verdict = host.querySelector(".qv-verdict");

  function project(p) {
    var ca = Math.cos(yaw), sa = Math.sin(yaw),
        cb = Math.cos(pitch), sb = Math.sin(pitch),
        x1 = p[0] * ca - p[1] * sa,
        y1 = p[0] * sa + p[1] * ca;
    return [x1, y1 * sb + p[2] * cb, y1 * cb - p[2] * sb];
  }

  function draw() {
    k1 = parseInt(s1.value, 10) / 10;
    k2 = parseInt(s2.value, 10) / 10;

    var dpr = window.devicePixelRatio || 1,
        /* capped so the sliders stay on screen together with the picture */
        w = cv.clientWidth || 560, hgt = Math.min(Math.round(w * 0.56), 400), i, j;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr);
    cv.style.height = hgt + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, hgt);
    ctx.direction = "ltr";          /* else minus signs in the readouts reorder */
    ctx.lineJoin = "round";

    function Z(u, v) { return 0.5 * (k1 * u * u + k2 * v * v); }

    var Sg = [], Pg = [], u, v, PW = R * 1.16;
    for (i = 0; i <= NG; i++) {
      Sg.push([]); Pg.push([]);
      u = -R + 2 * R * i / NG;
      for (j = 0; j <= NG; j++) {
        v = -R + 2 * R * j / NG;
        Sg[i].push(project([u, v, Z(u, v)]));
        Pg[i].push(project([-PW + 2 * PW * i / NG, -PW + 2 * PW * j / NG, 0]));
      }
    }

    var xs = [], ys = [];
    for (i = 0; i <= NG; i += 2) for (j = 0; j <= NG; j += 2) {
      xs.push(Sg[i][j][0], Pg[i][j][0]); ys.push(Sg[i][j][1], Pg[i][j][1]);
    }
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs),
        ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys),
        pad = 1.14,
        sc = Math.min(w / ((xmax - xmin) * pad || 1), hgt / ((ymax - ymin) * pad || 1)),
        cx = w / 2 - sc * (xmin + xmax) / 2,
        cy = hgt / 2 + sc * (ymin + ymax) / 2;
    function S(q) { return [cx + sc * q[0], cy - sc * q[1]]; }

    var quads = [];
    for (i = 0; i < NG; i++) for (j = 0; j < NG; j++) {
      var uu = -R + 2 * R * (i + 0.5) / NG, vv = -R + 2 * R * (j + 0.5) / NG;
      quads.push({ z: (Sg[i][j][2] + Sg[i + 1][j][2] + Sg[i + 1][j + 1][2] +
                       Sg[i][j + 1][2]) / 4,
                   p: [Sg[i][j], Sg[i + 1][j], Sg[i + 1][j + 1], Sg[i][j + 1]],
                   kind: Z(uu, vv) >= 0 ? "up" : "down" });
      quads.push({ z: (Pg[i][j][2] + Pg[i + 1][j][2] + Pg[i + 1][j + 1][2] +
                       Pg[i][j + 1][2]) / 4,
                   p: [Pg[i][j], Pg[i + 1][j], Pg[i + 1][j + 1], Pg[i][j + 1]],
                   kind: "plane" });
    }
    quads.sort(function (a, b) { return a.z - b.z; });
    quads.forEach(function (Q) {
      ctx.beginPath();
      var s0 = S(Q.p[0]); ctx.moveTo(s0[0], s0[1]);
      for (var m = 1; m < 4; m++) { var sm = S(Q.p[m]); ctx.lineTo(sm[0], sm[1]); }
      ctx.closePath();
      if (Q.kind === "plane") {
        ctx.fillStyle = COL.plane; ctx.globalAlpha = 0.26; ctx.fill();
        ctx.globalAlpha = 0.30; ctx.strokeStyle = COL.plane;
      } else {
        ctx.fillStyle = Q.kind === "up" ? COL.up : COL.down;
        ctx.globalAlpha = 0.60; ctx.fill();
        ctx.globalAlpha = 0.70;
        ctx.strokeStyle = Q.kind === "up" ? COL.upEdge : COL.downEdge;
      }
      ctx.lineWidth = 0.4; ctx.stroke(); ctx.globalAlpha = 1;
    });

    var so = S(project([0, 0, 0]));
    ctx.beginPath(); ctx.arc(so[0], so[1], 5, 0, TWO_PI);
    ctx.fillStyle = COL.pt; ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.2; ctx.stroke();

    v1.textContent = fmt(k1);
    v2.textContent = fmt(k2);
    rK.textContent = fmt(k1 * k2, 3);
    rH.textContent = fmt((k1 + k2) / 2, 3);

    var z1 = k1 === 0, z2 = k2 === 0, msg, col;
    if (z1 && z2) {
      msg = "שתי העקמומיויות הראשיות מתאפסות, ולכן K = 0 וגם H = 0: נקודה מישורית. הקירוב מסדר שני הוא מישור, ובמקרה הזה הוא אינו קובע את צורת המשטח כלל.";
      col = "#7c3aed";
    } else if (z1 || z2) {
      msg = "בדיוק אחת מן העקמומיויות מתאפסת, ולכן K = 0 אבל H ≠ 0: נקודה פרבולית. הקירוב הוא גליל פרבולי, והמשטח ישר לגמרי בכיוון אחד.";
      col = "#0f766e";
    } else if (k1 * k2 > 0) {
      msg = "שתי העקמומיויות מאותו סימן, ולכן K > 0: נקודה אליפטית. הקירוב הוא פרבולואיד אליפטי, והמשטח נשאר כולו בצד אחד של המישור המשיק, ולכן רואים צבע אחד בלבד.";
      col = COL.up;
    } else {
      msg = "העקמומיויות מסימנים מנוגדים, ולכן K < 0: נקודה היפרבולית. הקירוב הוא פרבולואיד היפרבולי, המישור המשיק חותך את המשטח, ושני הצבעים מתחלפים ברביעים. שני הכיוונים שבהם מתחלף הצבע הם הכיוונים האסימפטוטיים.";
      col = COL.down;
    }
    verdict.textContent = msg;
    verdict.style.color = col;
    verdict.style.fontWeight = "600";
  }

  var dragging = false, lastX = 0, lastY = 0;
  function down(e) {
    dragging = true;
    var p = e.touches ? e.touches[0] : e;
    lastX = p.clientX; lastY = p.clientY;
    if (e.touches) e.preventDefault();
  }
  function move(e) {
    if (!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    yaw += (p.clientX - lastX) * 0.01;
    pitch += (p.clientY - lastY) * 0.01;
    pitch = Math.max(-1.35, Math.min(1.35, pitch));
    lastX = p.clientX; lastY = p.clientY;
    if (e.touches) e.preventDefault();
    draw();
  }
  function up() { dragging = false; }

  cv.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  cv.addEventListener("touchstart", down, { passive: false });
  cv.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", up);

  s1.addEventListener("input", draw);
  s2.addEventListener("input", draw);
  window.addEventListener("resize", draw);
  draw();
})();
</script>
</body>
</html>
