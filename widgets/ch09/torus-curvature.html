<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מיון נקודות על הטורוס</title>
<link rel="stylesheet" href="../shared/quadviz.css">
</head>
<body>
<div id="app"></div>
<script src="../shared/autosize.js"></script>

<script>
/* torus-curvature.html — the torus shaded by the sign of the Gaussian curvature.
   ---------------------------------------------------------------------------
   Standalone rather than a Surface3D.mount() call: that module has no per-quad
   colouring and no curvature readouts, and four other widgets depend on it.
   Projection, painter's algorithm and the auto-fit are copied from surface3d.js
   so the page looks like the rest of the book, and the quads are shaded as in
   ch07/mobius.html because a torus self-occludes.

   Everything numeric here — g_ij, L_ij, K, H, k1, k2 — is computed from the
   parametrisation by central differences, NOT from the closed forms derived in
   the exercise. So the picture is an independent check on that algebra rather
   than a replay of it: if the exercise were wrong, the readouts would disagree.

       x(u,v) = ( (R + r cos u) cos v, (R + r cos u) sin v, r sin u ),  R > r > 0

   Central-difference step 1e-3: truncation is O(h^2) ~ 1e-6 and round-off in the
   second differences is O(eps/h^2) ~ 1e-10, so both stay far below the two
   decimals shown.
   --------------------------------------------------------------------------- */
(function () {
  "use strict";

  var COL = {
    ell:  "#1f4e79", ellEdge: "#16385a",    /* K > 0, elliptic  */
    hyp:  "#c0392b", hypEdge: "#8d2a1e",    /* K < 0, hyperbolic */
    par:  "#0f172a",                        /* K = 0, the two circles */
    nrm:  "#7c3aed", pt: "#0f172a"
  };

  var TWO_PI = 2 * Math.PI, NU = 44, NV = 76, R = 1, h = 1e-3;

  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function norm(a) { return Math.sqrt(dot(a, a)); }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function unit(a) { var n = norm(a); return n ? mul(a, 1 / n) : a; }
  function fmt(v, d) {
    var s = (Math.abs(v) < 5e-4 ? 0 : v).toFixed(d === undefined ? 2 : d);
    return s === "-0.00" ? "0.00" : s;
  }

  function X(u, v, r) {
    var w = R + r * Math.cos(u);
    return [w * Math.cos(v), w * Math.sin(v), r * Math.sin(u)];
  }

  /* the whole local frame, by central differences on X alone */
  function local(u, v, r) {
    var xu  = mul(sub(X(u + h, v, r), X(u - h, v, r)), 1 / (2 * h)),
        xv  = mul(sub(X(u, v + h, r), X(u, v - h, r)), 1 / (2 * h)),
        xuu = mul(add(sub(X(u + h, v, r), mul(X(u, v, r), 2)), X(u - h, v, r)), 1 / (h * h)),
        xvv = mul(add(sub(X(u, v + h, r), mul(X(u, v, r), 2)), X(u, v - h, r)), 1 / (h * h)),
        xuv = mul(add(sub(sub(X(u + h, v + h, r), X(u + h, v - h, r)), X(u - h, v + h, r)),
                      X(u - h, v - h, r)), 1 / (4 * h * h)),
        N = unit(cross(xu, xv)),
        g11 = dot(xu, xu), g12 = dot(xu, xv), g22 = dot(xv, xv),
        L11 = dot(xuu, N), L12 = dot(xuv, N), L22 = dot(xvv, N),
        detg = g11 * g22 - g12 * g12,
        K = (L11 * L22 - L12 * L12) / detg,
        H = (L11 * g22 - 2 * L12 * g12 + L22 * g11) / (2 * detg),
        disc = Math.sqrt(Math.max(0, H * H - K));
    return { N: N, K: K, H: H, k1: H + disc, k2: H - disc, p: X(u, v, r) };
  }

  var host = document.getElementById("app"),
      yaw = -0.95, pitch = 0.62, rad = 0.4, uSel = 0, vSel = 0.9;

  host.innerHTML =
    '<div class="qv">' +
      '<p class="qv-title" dir="ltr">x(u,v) = ( (R + r cos u) cos v, (R + r cos u) sin v, r sin u ),   R = 1,  r = 0.4</p>' +
      '<div class="qv-canvas-wrap"><canvas class="qv-canvas qv-grab"></canvas></div>' +
      '<div class="qv-row">' +
        '<span class="qv-label">מיקום על המעגל הקטן</span>' +
        '<input class="qv-slider qv-u" type="range" min="0" max="1000" value="0">' +
        '<span class="qv-badge qv-uval"></span>' +
      '</div>' +
      '<div class="qv-row">' +
        '<span class="qv-label">מיקום סביב הציר</span>' +
        '<input class="qv-slider qv-v" type="range" min="0" max="1000" value="143">' +
        '<span class="qv-badge qv-vval"></span>' +
      '</div>' +
      '<div class="qv-readout">' +
        '<div><span class="qv-rl">k&#8321;</span><span class="qv-rv qv-r-k1"></span></div>' +
        '<div><span class="qv-rl">k&#8322;</span><span class="qv-rv qv-r-k2"></span></div>' +
        '<div><span class="qv-rl">K = k&#8321;k&#8322;</span><span class="qv-rv qv-r-K"></span></div>' +
        '<div><span class="qv-rl">H = (k&#8321;+k&#8322;)/2</span><span class="qv-rv qv-r-H"></span></div>' +
      '</div>' +
      '<div class="qv-legend">' +
        '<span><i class="qv-key" style="background:#1f4e79"></i>K &gt; 0</span>' +
        '<span><i class="qv-key" style="background:#c0392b"></i>K &lt; 0</span>' +
        '<span><i class="qv-key" style="background:#0f172a"></i>K = 0</span>' +
      '</div>' +
      /* no dedicated class in quadviz.css: reuse the hint's prose styling and
         override only weight and colour from draw(), as ch07/mobius.html does */
      '<p class="qv-hint qv-verdict"></p>' +
      '<div class="qv-hint">גררו את הציור כדי לסובב את המבט. החלק הכחול הוא החלק החיצוני של הטורוס, שבו העקמומיות חיובית, והאדום הוא החלק הפנימי הפונה אל הציר. שני המעגלים הכהים מפרידים ביניהם.</div>' +
    '</div>';

  var cv = host.querySelector("canvas"), ctx = cv.getContext("2d"),
      sU = host.querySelector(".qv-u"), uv = host.querySelector(".qv-uval"),
      sV = host.querySelector(".qv-v"), vv = host.querySelector(".qv-vval"),
      rk1 = host.querySelector(".qv-r-k1"), rk2 = host.querySelector(".qv-r-k2"),
      rK = host.querySelector(".qv-r-K"), rH = host.querySelector(".qv-r-H"),
      verdict = host.querySelector(".qv-verdict");

  function project(p) {
    var ca = Math.cos(yaw), sa = Math.sin(yaw),
        cb = Math.cos(pitch), sb = Math.sin(pitch),
        x1 = p[0] * ca - p[1] * sa,
        y1 = p[0] * sa + p[1] * ca;
    return [x1, y1 * sb + p[2] * cb, y1 * cb - p[2] * sb];
  }

  function draw() {
    uSel = (sU.value / 1000) * TWO_PI;
    vSel = (sV.value / 1000) * TWO_PI;

    var dpr = window.devicePixelRatio || 1,
        w = cv.clientWidth || 560, hgt = Math.round(w * 0.56), i, j;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr);
    cv.style.height = hgt + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, hgt);
    ctx.direction = "ltr";          /* else the minus sign of K < 0 reorders */
    ctx.lineJoin = "round";

    var G = [], u, v;
    for (i = 0; i <= NU; i++) {
      G.push([]);
      u = (i / NU) * TWO_PI;
      for (j = 0; j <= NV; j++) {
        v = (j / NV) * TWO_PI;
        G[i].push(project(X(u, v, rad)));
      }
    }

    var xs = [], ys = [];
    for (i = 0; i <= NU; i += 2) for (j = 0; j <= NV; j += 2) {
      xs.push(G[i][j][0]); ys.push(G[i][j][1]);
    }
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs),
        ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys),
        pad = 1.18,
        sc = Math.min(w / ((xmax - xmin) * pad || 1), hgt / ((ymax - ymin) * pad || 1)),
        cx = w / 2 - sc * (xmin + xmax) / 2,
        cy = hgt / 2 + sc * (ymin + ymax) / 2;
    function S(q) { return [cx + sc * q[0], cy - sc * q[1]]; }

    /* ---- shaded quads, coloured by sign(K) at the quad centre ---- */
    var quads = [];
    for (i = 0; i < NU; i++) for (j = 0; j < NV; j++) {
      var uc = ((i + 0.5) / NU) * TWO_PI, vc = ((j + 0.5) / NV) * TWO_PI,
          Lc = local(uc, vc, rad),
          a = G[i][j], b = G[i + 1][j], c = G[i + 1][j + 1], d = G[i][j + 1],
          nn = project(Lc.N);
      quads.push({ z: (a[2] + b[2] + c[2] + d[2]) / 4, p: [a, b, c, d],
                   pos: Lc.K >= 0, lit: Math.abs(nn[2]) });
    }
    quads.sort(function (p, q) { return p.z - q.z; });
    ctx.lineWidth = 0.4;
    quads.forEach(function (Q) {
      ctx.beginPath();
      var s0 = S(Q.p[0]); ctx.moveTo(s0[0], s0[1]);
      for (var m = 1; m < 4; m++) { var sm = S(Q.p[m]); ctx.lineTo(sm[0], sm[1]); }
      ctx.closePath();
      /* mix the band colour towards white with the facing angle, as in mobius */
      var f = 0.30 + 0.70 * Q.lit,
          base = Q.pos ? [0x1f, 0x4e, 0x79] : [0xc0, 0x39, 0x2b];
      ctx.fillStyle = "rgb(" + Math.round(255 - (255 - base[0]) * f) + "," +
                               Math.round(255 - (255 - base[1]) * f) + "," +
                               Math.round(255 - (255 - base[2]) * f) + ")";
      ctx.fill();
      ctx.strokeStyle = Q.pos ? COL.ellEdge : COL.hypEdge;
      ctx.globalAlpha = 0.35; ctx.stroke(); ctx.globalAlpha = 1;
    });

    /* ---- the two parabolic circles, u = pi/2 and u = 3pi/2 ---- */
    ctx.strokeStyle = COL.par; ctx.lineWidth = 2.4;
    [Math.PI / 2, 3 * Math.PI / 2].forEach(function (u0) {
      ctx.beginPath();
      for (var m = 0; m <= 180; m++) {
        var s = S(project(X(u0, (m / 180) * TWO_PI, rad)));
        if (m === 0) ctx.moveTo(s[0], s[1]); else ctx.lineTo(s[0], s[1]);
      }
      ctx.stroke();
    });

    /* ---- the moving point and its normal ---- */
    var Lp = local(uSel, vSel, rad),
        s1 = S(project(Lp.p)), s2 = S(project(add(Lp.p, mul(Lp.N, 0.45))));
    ctx.beginPath(); ctx.moveTo(s1[0], s1[1]); ctx.lineTo(s2[0], s2[1]);
    ctx.strokeStyle = COL.nrm; ctx.lineWidth = 2.6; ctx.stroke();
    var ang = Math.atan2(s2[1] - s1[1], s2[0] - s1[0]);
    ctx.beginPath();
    ctx.moveTo(s2[0], s2[1]);
    ctx.lineTo(s2[0] - 9 * Math.cos(ang - 0.4), s2[1] - 9 * Math.sin(ang - 0.4));
    ctx.lineTo(s2[0] - 9 * Math.cos(ang + 0.4), s2[1] - 9 * Math.sin(ang + 0.4));
    ctx.closePath(); ctx.fillStyle = COL.nrm; ctx.fill();
    ctx.beginPath(); ctx.arc(s1[0], s1[1], 5, 0, TWO_PI);
    ctx.fillStyle = COL.pt; ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.2; ctx.stroke();

    /* ---- readouts ---- */
    uv.textContent = fmt(uSel / Math.PI) + "π";
    vv.textContent = fmt(vSel / Math.PI) + "π";
    rk1.textContent = fmt(Lp.k1, 3);
    rk2.textContent = fmt(Lp.k2, 3);
    rK.textContent = fmt(Lp.K, 3);
    rH.textContent = fmt(Lp.H, 3);

    var c = Math.cos(uSel), msg, col;
    if (Math.abs(c) < 0.02) {
      msg = "כאן cos u מתאפס, ולכן K = 0 בעוד שעקמומיות ראשית אחת עדיין שונה מאפס. זוהי נקודה פרבולית, על אחד משני המעגלים הכהים.";
      col = COL.par;
    } else if (c > 0) {
      msg = "כאן cos u חיובי, ולכן K > 0: שתי העקמומיויות הראשיות מאותו סימן. זוהי נקודה אליפטית, על החלק החיצוני של הטורוס, והמשטח נראה שם כמו כיפה.";
      col = COL.ell;
    } else {
      msg = "כאן cos u שלילי, ולכן K < 0: העקמומיויות הראשיות מסימנים מנוגדים. זוהי נקודה היפרבולית, על החלק הפנימי הפונה אל הציר, והמשטח נראה שם כמו אוכף.";
      col = COL.hyp;
    }
    verdict.textContent = msg;
    verdict.style.color = col;
    verdict.style.fontWeight = "600";
  }

  /* ---- drag to rotate ---- */
  var dragging = false, lastX = 0, lastY = 0;
  function down(e) {
    dragging = true;
    var p = e.touches ? e.touches[0] : e;
    lastX = p.clientX; lastY = p.clientY;
    if (e.touches) e.preventDefault();
  }
  function move(e) {
    if (!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    yaw += (p.clientX - lastX) * 0.01;
    pitch += (p.clientY - lastY) * 0.01;
    pitch = Math.max(-1.45, Math.min(1.45, pitch));
    lastX = p.clientX; lastY = p.clientY;
    if (e.touches) e.preventDefault();
    draw();
  }
  function up() { dragging = false; }

  cv.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  cv.addEventListener("touchstart", down, { passive: false });
  cv.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", up);

  sU.addEventListener("input", draw);
  sV.addEventListener("input", draw);
  window.addEventListener("resize", draw);
  draw();
})();
</script>
</body>
</html>
