<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משולש גיאודזי על ספירת היחידה והגזרות</title>
<link rel="stylesheet" href="../shared/quadviz.css">
</head>
<body>
<div id="app"></div>
<script src="../shared/autosize.js"></script>

<script>
/* spherical-lunes.html — the lune argument for alpha + beta + gamma - pi = T.
   ---------------------------------------------------------------------------
   ONE exercise: a geodesic triangle on the unit sphere, its three sides extended
   to full great circles, and the lune (גזרה) belonging to one vertex angle. A
   lune of angle theta is the fraction theta/2pi of the sphere, hence has area
   2theta -- and it CONTAINS the triangle, which is the step the picture is for.

   Standalone rather than a Surface3D.mount() call: that module draws a graph
   z = f(u,v) with x_u, x_v and a tangent patch, and has no notion of a shaded
   region lying on the surface. Projection, painter's algorithm and the auto-fit
   are copied from surface3d.js so the page looks like the rest of the book.

   GEOMETRY, all from the definitions rather than from any formula the exercise
   is meant to prove:

     * great circle through unit a, b:  a cos s + n^ sin s,  n^ the unit vector
       in span{a,b} orthogonal to a, i.e. n^ = unit(b - <b,a> a).
     * interior angle at a vertex v with the other endpoints p, q: the dihedral
       angle between the two side planes, from their normals
           n1 = v x p,   n2 = v x q,   angle = arccos(<n1^, n2^>).
       No sign ambiguity: both normals are taken with v FIRST, so crossing each
       with v returns the two side tangents at v, which point INTO the sides.
       The angle between the normals is therefore the interior angle, in (0,pi).
     * lune at v: sweep the great semicircles from v to -v whose initial tangent
       runs from t_p to t_q the short way. That is exactly the lune bounded by
       the two great circles and containing the triangle.
     * area T: NOT from Girard. The triangle is swept by the central projection
       of the flat triangle ABC,
           f(s,t) = sA + (1-s)tB + (1-s)(1-t)C,   x = f/|f|,  (s,t) in [0,1]^2,
       and T is the midpoint-rule integral of |x_s x x_t| over that square, with
       x_s, x_t taken analytically. The readout prints the spherical excess and
       this integral SIDE BY SIDE together with their difference, so the identity
       is a visible self-check: if the geometry above is ever broken, the fourth
       line stops reading zero. Measured worst case over the whole slider range,
       at N = 128, is 2.3e-5, attained at the home position.

   DEPTH. The sphere is drawn by a painter's algorithm, sorted on the depth of
   each quad's PARAMETER CENTRE (not the mean of its corners -- the sagitta of a
   corner mean is larger than any sane radial offset, and a radially-offset shell
   then gets struck through by the sphere's own grid). The lune and the triangle
   are then drawn on top, Sutherland-Hodgman clipped to the visible hemisphere
   {depth >= 0}: the sphere is convex and opaque, so that clip is exact, the back
   of the sphere cannot show through, and there is nothing left to z-fight.
   Clipping in projected coordinates is legitimate because the projection is
   orthographic, hence linear, so interpolating before or after it is the same.

   CONFIGURATION. B = (1,0,0), C = (0,1,0), and A slides along the meridian
   phi = 0.55, all three then carried by one fixed rotation. The slider's home
   position puts A at the pole of that meridian: the triangle is then one OCTANT
   of the sphere, all three angles are right angles, and both numbers read
   pi/2 = 1.5708 -- a case the reader can check in their head before deforming
   it. Two deliberate choices: phi is 0.55 rather than pi/4, so that off the home
   position the three angles are all DIFFERENT and the reader cannot mistake the
   identity for a symmetry; and the fixed rotation exists only to move the
   configuration off the lat/long mesh poles, where the sphere's own grid
   converges -- without it that convergence lands exactly on vertex A.
   --------------------------------------------------------------------------- */
(function () {
  "use strict";

  var COL = {
    ball:  "#dbe6f0", ballEdge: "#a8c0d8",   /* the sphere                  */
    lune:  "#f6d5ad",                        /* the shaded lune             */
    tri:   "#ee9f6d",                        /* the geodesic triangle       */
    gc:    "#1f4e79",                        /* the three great circles     */
    side:  "#c0392b",                        /* the three sides of triangle */
    pin:   "#0f172a",                        /* vertices and angle marks    */
    sel:   "#b45309"                         /* the selected vertex angle   */
  };

  var TWO_PI = 2 * Math.PI, PI = Math.PI;

  /* ---- vectors ---- */
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function norm(a) { return Math.sqrt(dot(a, a)); }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function unit(a) { var n = norm(a); return n ? mul(a, 1 / n) : a; }
  function clamp1(x) { return x < -1 ? -1 : (x > 1 ? 1 : x); }
  function fmt(v, d) {
    var s = (Math.abs(v) < 5e-6 ? 0 : v).toFixed(d === undefined ? 2 : d);
    return /^-0\.0*$/.test(s) ? s.slice(1) : s;
  }
  function sph(th, ph) {
    return [Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)];
  }

  /* ---- the geometry of the triangle ---- */

  /* interior angle at v, from the normals of the two side planes */
  function angleAt(v, p, q) {
    return Math.acos(clamp1(dot(unit(cross(v, p)), unit(cross(v, q)))));
  }
  /* the unit tangent at a, pointing along the arc towards b */
  function tangentTo(a, b) { return unit(sub(b, mul(a, dot(b, a)))); }

  /* the great circle through a and b, sampled */
  function greatCircle(a, b, n) {
    var nh = tangentTo(a, b), out = [], k, s;
    for (k = 0; k <= n; k++) {
      s = (k / n) * TWO_PI;
      out.push(add(mul(a, Math.cos(s)), mul(nh, Math.sin(s))));
    }
    return out;
  }
  /* the minor arc from a to b, sampled */
  function minorArc(a, b, n) {
    var nh = tangentTo(a, b), L = Math.acos(clamp1(dot(a, b))), out = [], k, s;
    for (k = 0; k <= n; k++) {
      s = (k / n) * L;
      out.push(add(mul(a, Math.cos(s)), mul(nh, Math.sin(s))));
    }
    return out;
  }

  /* the lune at v between the great circles GC(v,p) and GC(v,q): the frame in
     which it is swept, plus its angle */
  function luneFrame(v, p, q) {
    var tp = tangentTo(v, p), tq = tangentTo(v, q),
        e = unit(sub(tq, mul(tp, dot(tq, tp))));
    return { v: v, t: tp, e: e, ang: angleAt(v, p, q) };
  }
  /* psi in [0, ang] runs across the lune, s in [0, pi] runs from v to -v */
  function lunePoint(F, psi, s) {
    var d = add(mul(F.t, Math.cos(psi)), mul(F.e, Math.sin(psi)));
    return add(mul(F.v, Math.cos(s)), mul(d, Math.sin(s)));
  }

  /* the triangle, as the central projection of the flat triangle ABC */
  function triPoint(A, B, C, s, t) {
    var om = 1 - s, w2 = om * t;
    return unit([s * A[0] + w2 * B[0] + (om - w2) * C[0],
                 s * A[1] + w2 * B[1] + (om - w2) * C[1],
                 s * A[2] + w2 * B[2] + (om - w2) * C[2]]);
  }

  /* Area of the spherical triangle by midpoint integration of |x_s x x_t| over
     the unit square. Written out in scalars, with no allocation, so it can be
     re-run on every slider step; and with ANALYTIC derivatives,
         f_s = A - tB - (1-t)C,   f_t = (1-s)(B - C),
         x_u = (f_u - <x, f_u> x) / |f|,
     so there is no differencing step to lose precision. Independent of Girard:
     nothing here knows that the answer is meant to be the spherical excess. */
  function triArea(A, B, C) {
    var N = 128, inv = 1 / N, tot = 0, i, j,
        ax = A[0], ay = A[1], az = A[2],
        bx = B[0], by = B[1], bz = B[2],
        gx = C[0], gy = C[1], gz = C[2];
    for (i = 0; i < N; i++) {
      var s = (i + 0.5) * inv, om = 1 - s;
      for (j = 0; j < N; j++) {
        var t = (j + 0.5) * inv, w2 = om * t, w3 = om - w2,
            fx = s * ax + w2 * bx + w3 * gx,
            fy = s * ay + w2 * by + w3 * gy,
            fz = s * az + w2 * bz + w3 * gz,
            r  = Math.sqrt(fx * fx + fy * fy + fz * fz),
            hx = fx / r, hy = fy / r, hz = fz / r,
            sx = ax - t * bx - (1 - t) * gx,
            sy = ay - t * by - (1 - t) * gy,
            sz = az - t * bz - (1 - t) * gz,
            tx = om * (bx - gx), ty = om * (by - gy), tz = om * (bz - gz),
            ps = hx * sx + hy * sy + hz * sz,
            pt = hx * tx + hy * ty + hz * tz,
            ux = (sx - ps * hx) / r, uy = (sy - ps * hy) / r, uz = (sz - ps * hz) / r,
            vx = (tx - pt * hx) / r, vy = (ty - pt * hy) / r, vz = (tz - pt * hz) / r,
            nx = uy * vz - uz * vy,
            ny = uz * vx - ux * vz,
            nz = ux * vy - uy * vx;
        tot += Math.sqrt(nx * nx + ny * ny + nz * nz);
      }
    }
    return tot * inv * inv;
  }
  /* the integral costs 128^2 cells, so it is re-run only when the slider moves,
     never on a rotation drag */
  var areaKey = null, areaVal = 0;
  function triAreaCached(A, B, C, key) {
    if (key !== areaKey) { areaKey = key; areaVal = triArea(A, B, C); }
    return areaVal;
  }

  /* ---- the configuration ---- */

  /* One fixed rotation, applied to all three vertices. Its only job is to move
     the triangle off the poles of the lat/long mesh: undisplaced, vertex A sits
     exactly where the sphere's own grid converges, and the crowded grid lines
     read as a blemish on the most important vertex in the picture. A rotation
     changes nothing else -- angles, areas and B x C all travel with it. */
  function rotCfg(p) {
    var c1 = Math.cos(0.62), s1 = Math.sin(0.62),
        c2 = Math.cos(0.45), s2 = Math.sin(0.45),
        y1 = p[1] * c1 - p[2] * s1,
        z1 = p[1] * s1 + p[2] * c1;
    return [p[0] * c2 - y1 * s2, p[0] * s2 + y1 * c2, z1];
  }

  var PHI_A = 0.55,
      B = rotCfg([1, 0, 0]),
      C = rotCfg([0, 1, 0]);
  function vertexA(th) { return rotCfg(sph(th, PHI_A)); }

  var host = document.getElementById("app"), which = 0, yaw, pitch;

  /* Look down the centroid of the home triangle, then step off it a little so
     the sphere still reads as a sphere. Derived rather than hard-coded, so that
     editing the configuration above cannot leave the camera facing the back. */
  (function () {
    var m = unit(add(add(vertexA(0), B), C));
    yaw   = Math.atan2(m[0], m[1]) + 0.28;
    pitch = -Math.asin(clamp1(m[2])) + 0.30;
  })();

  host.innerHTML =
    '<div class="qv">' +
      '<p class="qv-title">משולש גיאודזי על ספירת היחידה, והגזרה שבקודקוד</p>' +
      '<div class="qv-canvas-wrap"><canvas class="qv-canvas qv-grab"></canvas></div>' +
      '<div class="qv-row">' +
        '<span class="qv-label">מרחק הקודקוד A מן הצלע שמולו</span>' +
        '<input class="qv-slider qv-a" type="range" min="0" max="1400" step="1" value="0">' +
        '<span class="qv-badge qv-aval"></span>' +
      '</div>' +
      '<div class="qv-row">' +
        '<span class="qv-label">הגזרה המודגשת</span>' +
        '<button class="qv-btn qv-w" data-w="0" type="button">&alpha;</button>' +
        '<button class="qv-btn qv-w" data-w="1" type="button">&beta;</button>' +
        '<button class="qv-btn qv-w" data-w="2" type="button">&gamma;</button>' +
      '</div>' +
      '<div class="qv-legend">' +
        '<span><i class="qv-key" style="background:' + COL.tri + ';height:0.7em"></i>המשולש הגיאודזי</span>' +
        '<span><i class="qv-key" style="background:' + COL.lune + ';height:0.7em"></i>הגזרה שבקודקוד הנבחר</span>' +
        '<span><i class="qv-key" style="background:' + COL.gc + '"></i>המעגלים הגדולים</span>' +
        '<span><i class="qv-key" style="background:' + COL.side + '"></i>צלעות המשולש</span>' +
      '</div>' +
      '<div class="qv-readout">' +
        '<div><span class="qv-rl">&alpha;, &beta;, &gamma;</span><span class="qv-rv qv-r-ang"></span></div>' +
        '<div><span class="qv-rl">&alpha; + &beta; + &gamma; &minus; &pi;</span><span class="qv-rv qv-r-exc"></span></div>' +
        '<div><span class="qv-rl">T&nbsp; (area)</span><span class="qv-rv qv-r-area"></span></div>' +
        '<div><span class="qv-rl">difference</span><span class="qv-rv qv-r-diff"></span></div>' +
        '<div><span class="qv-rl">2&theta;&nbsp; (lune)</span><span class="qv-rv qv-r-lune"></span></div>' +
      '</div>' +
      '<ul class="qv-gloss">' +
        '<li><b>&alpha;, &beta;, &gamma;</b> &mdash; זוויות המשולש, כלומר הזוויות בין המישורים של כל שתי צלעות הנפגשות בקודקוד.</li>' +
        '<li><b>T</b> &mdash; שטח המשולש, מחושב באינטגרציה נומרית של אלמנט השטח על פני המשולש עצמו, בלי להיעזר בזהות שמוכיחים.</li>' +
        '<li><b>difference</b> &mdash; ההפרש בין שני הגדלים הקודמים. הוא אפס עד כדי שגיאת האינטגרציה, וזו בדיקה עצמית של הציור.</li>' +
        '<li><b>2&theta;</b> &mdash; שטח הגזרה המודגשת, כאשר <span dir="ltr">&theta;</span> היא הזווית שבקודקוד שלה. בסוגריים מופיע החלק שהגזרה תופסת מן הספירה, כלומר <span dir="ltr">&theta;/2&pi;</span>.</li>' +
      '</ul>' +
      /* no dedicated class in quadviz.css: reuse the hint's prose styling and
         override only weight and colour from draw(), as ch07/mobius.html does */
      '<p class="qv-hint qv-verdict"></p>' +
      '<div class="qv-hint">גררו את הציור כדי לסובב את המבט. שלוש הצלעות מוארכות למעגלים גדולים שלמים, וכל שניים מהם חותכים מן הספירה גזרה. הגזרה המודגשת היא זו שמכילה את המשולש, ושטחה <span dir="ltr">2&theta;</span> משום שהיא תופסת מן הספירה בדיוק <span dir="ltr">&theta;/2&pi;</span>. הזיזו את הקודקוד A וראו ששטח המשולש נשאר שווה ל<span dir="ltr">-&alpha; + &beta; + &gamma; &minus; &pi;</span>.</div>' +
    '</div>';

  var cv = host.querySelector("canvas"), ctx = cv.getContext("2d"),
      sA = host.querySelector(".qv-a"), aval = host.querySelector(".qv-aval"),
      btns = host.querySelectorAll(".qv-w"),
      rAng = host.querySelector(".qv-r-ang"),
      rExc = host.querySelector(".qv-r-exc"),
      rArea = host.querySelector(".qv-r-area"),
      rDiff = host.querySelector(".qv-r-diff"),
      rLune = host.querySelector(".qv-r-lune"),
      verdict = host.querySelector(".qv-verdict");

  function project(p) {
    var ca = Math.cos(yaw), sa = Math.sin(yaw),
        cb = Math.cos(pitch), sb = Math.sin(pitch),
        x1 = p[0] * ca - p[1] * sa,
        y1 = p[0] * sa + p[1] * ca;
    return [x1, y1 * sb + p[2] * cb, y1 * cb - p[2] * sb];
  }

  /* Sutherland-Hodgman against the half-space {depth >= 0}. The sphere is convex
     and opaque, so that half-space is exactly the visible hemisphere; and the
     projection is linear, so clipping the projected polygon gives the same
     result as clipping in space and projecting afterwards. */
  function clipFront(poly) {
    var out = [], n = poly.length, i, cur, prv, curIn, prvIn, t;
    for (i = 0; i < n; i++) {
      cur = poly[i]; prv = poly[(i + n - 1) % n];
      curIn = cur[2] >= 0; prvIn = prv[2] >= 0;
      if (curIn !== prvIn) {                      /* the edge crosses the rim */
        t = prv[2] / (prv[2] - cur[2]);
        out.push([prv[0] + t * (cur[0] - prv[0]), prv[1] + t * (cur[1] - prv[1]), 0]);
      }
      if (curIn) out.push(cur);
    }
    return out;
  }

  /* mix a house colour towards white by the facing factor */
  function shade(hex, f) {
    var r = parseInt(hex.slice(1, 3), 16),
        g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
    return "rgb(" + Math.round(255 - (255 - r) * f) + "," +
                    Math.round(255 - (255 - g) * f) + "," +
                    Math.round(255 - (255 - b) * f) + ")";
  }

  function draw() {
    var raw = parseInt(sA.value, 10), thA = raw / 1000,
        A = vertexA(thA), V = [A, B, C],
        al = angleAt(A, B, C), be = angleAt(B, C, A), ga = angleAt(C, A, B),
        exc = al + be + ga - PI,
        T = triAreaCached(A, B, C, raw),
        i, j, a, b;

    var dpr = window.devicePixelRatio || 1,
        /* capped so the picture and its readouts stay on screen together; the
           auto-fit below is a min(), so the cap only adds side margin */
        w = cv.clientWidth || 560, hgt = Math.min(Math.round(w * 0.56), 400);
    cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr);
    cv.style.height = hgt + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, hgt);
    ctx.direction = "ltr";        /* else the minus signs in the labels reorder */
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    /* ---- the sphere, sampled once ---- */
    var NU = 28, NV = 56, G = [];
    for (i = 0; i <= NU; i++) {
      G.push([]);
      a = (i / NU) * PI;
      for (j = 0; j <= NV; j++) {
        b = (j / NV) * TWO_PI;
        G[i].push(project(sph(a, b)));
      }
    }

    /* ---- fit on the sphere alone, so nothing drawn on it can make the view
       jump as the slider moves ---- */
    var xs = [], ys = [];
    for (i = 0; i <= NU; i += 2) for (j = 0; j <= NV; j += 2) {
      xs.push(G[i][j][0]); ys.push(G[i][j][1]);
    }
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs),
        ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys),
        pad = 1.16,
        sc = Math.min(w / ((xmax - xmin) * pad || 1), hgt / ((ymax - ymin) * pad || 1)),
        cx = w / 2 - sc * (xmin + xmax) / 2,
        cy = hgt / 2 + sc * (ymin + ymax) / 2;
    function S(q) { return [cx + sc * q[0], cy - sc * q[1]]; }

    /* ---- painter's algorithm for the sphere. The sort key is the depth of the
       quad's PARAMETER CENTRE, which for a convex body is an exact painter's
       order; the mean of the four projected corners is not, because its sagitta
       is comparable to the spacing between neighbouring quads. ---- */
    var quads = [];
    for (i = 0; i < NU; i++) for (j = 0; j < NV; j++) {
      quads.push({
        z: project(sph(((i + 0.5) / NU) * PI, ((j + 0.5) / NV) * TWO_PI))[2],
        p: [G[i][j], G[i + 1][j], G[i + 1][j + 1], G[i][j + 1]]
      });
    }
    quads.sort(function (m, n) { return m.z - n.z; });
    ctx.lineWidth = 0.5;
    quads.forEach(function (Q) {
      var f = 0.58 + 0.42 * Math.min(1, Math.abs(Q.z)), s0 = S(Q.p[0]), m, sm;
      ctx.beginPath();
      ctx.moveTo(s0[0], s0[1]);
      for (m = 1; m < 4; m++) { sm = S(Q.p[m]); ctx.lineTo(sm[0], sm[1]); }
      ctx.closePath();
      ctx.fillStyle = shade(COL.ball, f); ctx.fill();
      ctx.strokeStyle = shade(COL.ballEdge, f * 0.8); ctx.stroke();
    });

    /* a shaded region on the sphere: clipped to the visible hemisphere, then
       still depth-sorted, and each quad stroked in its own fill colour so the
       anti-aliased seams between neighbours do not show as a mesh */
    function region(grid, centres, hex) {
      var cell = [], m, n, f, poly, s0, k, sk, c;
      for (m = 0; m < grid.length - 1; m++) {
        for (n = 0; n < grid[m].length - 1; n++) {
          c = [grid[m][n], grid[m + 1][n], grid[m + 1][n + 1], grid[m][n + 1]];
          /* Drop the cell only when all FOUR CORNERS are behind. Testing the
             centre instead would be wrong: a cell spans about 0.07 rad, so near
             the silhouette one whose centre is behind can still have a corner in
             front, and culling it would bite a notch out of the shaded region
             exactly at the rim. The sort key and the shading still come from the
             centre, which is where they belong. */
          if (c[0][2] < 0 && c[1][2] < 0 && c[2][2] < 0 && c[3][2] < 0) continue;
          cell.push({ z: centres[m][n], p: c });
        }
      }
      cell.sort(function (p, q) { return p.z - q.z; });
      ctx.lineWidth = 0.8;
      cell.forEach(function (Q) {
        poly = clipFront(Q.p);
        if (poly.length < 3) return;
        f = 0.58 + 0.42 * Math.min(1, Math.abs(Q.z));
        ctx.beginPath();
        s0 = S(poly[0]); ctx.moveTo(s0[0], s0[1]);
        for (k = 1; k < poly.length; k++) { sk = S(poly[k]); ctx.lineTo(sk[0], sk[1]); }
        ctx.closePath();
        ctx.fillStyle = shade(hex, f);
        ctx.strokeStyle = ctx.fillStyle;
        ctx.fill(); ctx.stroke();
      });
    }

    /* ---- the lune at the selected vertex ---- */
    var F = luneFrame(V[which], V[(which + 1) % 3], V[(which + 2) % 3]),
        NP = 26, NS = 46, LG = [], LZ = [];
    for (i = 0; i <= NP; i++) {
      LG.push([]); LZ.push([]);
      for (j = 0; j <= NS; j++) {
        LG[i].push(project(lunePoint(F, (i / NP) * F.ang, (j / NS) * PI)));
        if (i < NP && j < NS) {
          LZ[i].push(project(lunePoint(F, ((i + 0.5) / NP) * F.ang,
                                          ((j + 0.5) / NS) * PI))[2]);
        }
      }
    }
    region(LG, LZ, COL.lune);

    /* ---- the triangle, on the very map whose area element was integrated ---- */
    var NT = 22, TG = [], TZ = [];
    for (i = 0; i <= NT; i++) {
      TG.push([]); TZ.push([]);
      for (j = 0; j <= NT; j++) {
        TG[i].push(project(triPoint(A, B, C, i / NT, j / NT)));
        if (i < NT && j < NT) {
          TZ[i].push(project(triPoint(A, B, C, (i + 0.5) / NT, (j + 0.5) / NT))[2]);
        }
      }
    }
    region(TG, TZ, COL.tri);

    /* ---- polylines, split into the visible and the hidden half ---- */
    function polyline(pts, wantVisible, col, lw, alpha, dash) {
      var pen = false, k, s;
      ctx.beginPath();
      for (k = 0; k < pts.length; k++) {
        if ((pts[k][2] > 0) !== wantVisible) { pen = false; continue; }
        s = S(pts[k]);
        if (pen) { ctx.lineTo(s[0], s[1]); } else { ctx.moveTo(s[0], s[1]); pen = true; }
      }
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.globalAlpha = alpha;
      ctx.setLineDash(dash || []);
      ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }

    var pairs = [[A, B], [B, C], [C, A]], circles = [], arcs = [];
    for (i = 0; i < 3; i++) {
      circles.push(greatCircle(pairs[i][0], pairs[i][1], 220).map(project));
      arcs.push(minorArc(pairs[i][0], pairs[i][1], 90).map(project));
    }
    /* the hidden halves first, as ghosts through the sphere */
    circles.forEach(function (P) { polyline(P, false, COL.gc, 1.1, 0.16, [5, 4]); });
    circles.forEach(function (P) { polyline(P, true,  COL.gc, 1.6, 0.9); });
    arcs.forEach(function (P) { polyline(P, true, COL.side, 3.0, 1); });

    /* ---- the angle marks: a small circle arc at each vertex, spanning exactly
       the angle between the two sides. This is the same lune frame, cut off at
       a small radius, so what is marked really is what is measured. ---- */
    var EPS = 0.17;
    for (i = 0; i < 3; i++) {
      var Fi = luneFrame(V[i], V[(i + 1) % 3], V[(i + 2) % 3]), P = [], k;
      for (k = 0; k <= 40; k++) P.push(project(lunePoint(Fi, (k / 40) * Fi.ang, EPS)));
      polyline(P, true, i === which ? COL.sel : COL.pin, i === which ? 3.0 : 1.8, 1);
    }

    /* ---- vertices and their labels ---- */
    var names = ["A (α)", "B (β)", "C (γ)"];
    ctx.font = "600 12px ui-sans-serif, system-ui, sans-serif";
    for (i = 0; i < 3; i++) {
      var pv = project(V[i]);
      if (pv[2] <= 0) continue;
      var sv = S(pv), dx = sv[0] - cx, dy = sv[1] - cy,
          dn = Math.sqrt(dx * dx + dy * dy) || 1;
      ctx.beginPath(); ctx.arc(sv[0], sv[1], 4.6, 0, TWO_PI);
      ctx.fillStyle = COL.pin; ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.3; ctx.stroke();
      ctx.textAlign = dx >= 0 ? "left" : "right";
      ctx.textBaseline = dy >= 0 ? "top" : "bottom";
      ctx.fillStyle = i === which ? COL.sel : COL.pin;
      ctx.fillText(names[i], sv[0] + 9 * dx / dn, sv[1] + 9 * dy / dn);
    }
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";

    /* ---- readouts ---- */
    /* The badge is forced direction:ltr and is only 3.2rem wide, so it carries
       the number alone; its Hebrew name is the label beside the slider. What it
       shows is the angular distance from A to the great circle of the opposite
       side, arcsin|<A, (BxC)^>| -- a genuinely geometric quantity, positive and
       strictly decreasing across the whole slider, which A's own polar angle
       would not be. The foot of that perpendicular lies on the minor arc BC, so
       it really is the distance to the SIDE and not merely to its great circle. */
    var h = Math.asin(clamp1(Math.abs(dot(A, unit(cross(B, C))))));
    aval.textContent = fmt(h / PI) + "π";
    rAng.textContent = fmt(al, 4) + ", " + fmt(be, 4) + ", " + fmt(ga, 4);
    rExc.textContent = fmt(exc, 5);
    rArea.textContent = fmt(T, 5);
    rDiff.textContent = Math.abs(exc - T).toExponential(1);
    rLune.textContent = fmt(2 * F.ang, 5) +
                        "   (" + fmt(F.ang / TWO_PI, 4) + " of the sphere)";

    for (i = 0; i < btns.length; i++) {
      var on = i === which;
      btns[i].style.background = on ? COL.gc : "#f5f5f5";
      btns[i].style.color = on ? "#ffffff" : "inherit";
      btns[i].style.borderColor = on ? COL.gc : "#bbbbbb";
      btns[i].style.fontWeight = on ? "700" : "400";
    }

    /* The verdict goes in through textContent, so it cannot carry dir="ltr"
       spans the way the hint and the gloss above do. Every mathematical fragment
       is therefore wrapped in an explicit bidi isolate, U+2066 ... U+2069: left
       to the plain algorithm, a fragment such as "pi/2" is a strong letter, a
       neutral slash and a digit, and whether the slash joins the run or takes
       the paragraph's RTL direction depends on the surrounding text -- get it
       wrong and the reader is shown "2/pi". The isolates settle it outright. */
    /* HEADS UP: the two string literals on the next line are NOT empty. Each
       holds one invisible character -- L is U+2066 LEFT-TO-RIGHT ISOLATE and R
       is U+2069 POP DIRECTIONAL ISOLATE. They will look like "" in most editors,
       and an editor or a reformatter that strips "empty" strings, or a careless
       retype of the line, will silently take the protection away. */
    var L = "⁦", R = "⁩", msg;
    if (Math.abs(al - PI / 2) < 5e-3 && Math.abs(be - PI / 2) < 5e-3 &&
        Math.abs(ga - PI / 2) < 5e-3) {
      msg = "כאן שלוש הזוויות ישרות, והמשולש הוא שמינית מן הספירה. שטחו הוא " +
            "שמינית מ-" + L + "4π" + R + ", כלומר " + L + "π/2" + R + ", וזה " +
            "בדיוק סכום הזוויות פחות " + L + "π" + R + ". את המקרה הזה אפשר " +
            "לבדוק בלי שום חישוב.";
    } else if (exc < 0.25) {
      msg = "הקודקוד A מתקרב אל הצלע שמולו, המשולש מתכווץ, וסכום הזוויות שואף " +
            "ל-" + L + "π" + R + " כמו במישור. השטח " + L + "T" + R + " שואף " +
            "לאפס יחד איתו.";
    } else {
      msg = "הגזרה המודגשת מכילה את המשולש, ושטחה " + L + "2θ" + R + ". יש " +
            "שלוש גזרות כאלה, אחת לכל זווית, ומולן שלוש הגזרות האנטיפודליות; " +
            "שש הגזרות יחד מכסות את הספירה, ומכסות את המשולש ואת בן זוגו " +
            "האנטיפודלי שלוש פעמים כל אחד.";
    }
    verdict.textContent = msg;
    verdict.style.color = COL.gc;
    verdict.style.fontWeight = "600";
  }

  /* ---- drag to rotate ---- */
  var dragging = false, lastX = 0, lastY = 0;
  function down(e) {
    dragging = true;
    var p = e.touches ? e.touches[0] : e;
    lastX = p.clientX; lastY = p.clientY;
    if (e.touches) e.preventDefault();
  }
  function move(e) {
    if (!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    yaw += (p.clientX - lastX) * 0.01;
    pitch += (p.clientY - lastY) * 0.01;
    pitch = Math.max(-1.35, Math.min(1.35, pitch));
    lastX = p.clientX; lastY = p.clientY;
    if (e.touches) e.preventDefault();
    draw();
  }
  function up() { dragging = false; }

  cv.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  cv.addEventListener("touchstart", down, { passive: false });
  cv.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", up);

  sA.addEventListener("input", draw);
  for (var bi = 0; bi < btns.length; bi++) {
    btns[bi].addEventListener("click", function (e) {
      which = parseInt(e.currentTarget.getAttribute("data-w"), 10);
      draw();
    });
  }
  window.addEventListener("resize", draw);
  draw();
})();
</script>
</body>
</html>
